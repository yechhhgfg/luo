<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pikachu 动画</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #fef3c7 0%, #fde68a 100%);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    .wrap {
      text-align: center;
    }
    canvas {
      background: #fffef6;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
    }
    h1 {
      margin-bottom: 12px;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>皮卡丘动画</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const state = {
      blink: 0,
      blinkTimer: 0,
    };

    function drawFilledCircle(x, y, r, fillStyle, strokeStyle = null, lineWidth = 1) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = fillStyle;
      ctx.fill();
      if (strokeStyle) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      }
    }

    function drawPath(points, fillStyle, strokeStyle = null, lineWidth = 1) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i += 1) {
        ctx.lineTo(points[i][0], points[i][1]);
      }
      ctx.closePath();
      ctx.fillStyle = fillStyle;
      ctx.fill();
      if (strokeStyle) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      }
    }

    function drawEar(x, y, scaleX, scaleY) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scaleX, scaleY);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(12, -70, 18, -120);
      ctx.quadraticCurveTo(6, -90, -8, -40);
      ctx.closePath();
      ctx.fillStyle = '#facc15';
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(10, -48, 14, -90);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawPikachu() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fffef6';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawEar(300, 220, 1, 1);
      drawEar(500, 220, -1, 1);

      drawFilledCircle(400, 320, 180, '#facc15', '#000', 2);

      drawPath([
        [280, 390],
        [330, 430],
        [380, 450],
        [430, 450],
        [480, 430],
        [520, 390],
        [500, 440],
        [462, 482],
        [402, 510],
        [338, 484],
        [300, 440],
        [280, 390]
      ], '#facc15', '#000', 2);

      drawFilledCircle(320, 270, 18, '#fef3c7', '#000', 2);
      drawFilledCircle(480, 270, 18, '#fef3c7', '#000', 2);

      if (state.blink > 0) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(300, 270);
        ctx.lineTo(340, 270);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(460, 270);
        ctx.lineTo(500, 270);
        ctx.stroke();
      } else {
        drawFilledCircle(320, 270, 8, '#000');
        drawFilledCircle(480, 270, 8, '#000');
      }

      drawFilledCircle(320, 320, 18, '#fef2f2', '#000', 2);
      drawFilledCircle(480, 320, 18, '#fef2f2', '#000', 2);

      ctx.strokeStyle = '#c2410c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(400, 350, 60, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(340, 370);
      ctx.quadraticCurveTo(400, 410, 460, 370);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(250, 330);
      ctx.quadraticCurveTo(220, 300, 220, 250);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(550, 330);
      ctx.quadraticCurveTo(580, 300, 580, 250);
      ctx.stroke();

      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(310, 450);
      ctx.quadraticCurveTo(350, 480, 390, 500);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(490, 450);
      ctx.quadraticCurveTo(450, 480, 410, 500);
      ctx.stroke();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(260, 340, 30, 0, Math.PI * 2);
      ctx.arc(540, 340, 30, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '24px Microsoft YaHei';
      ctx.fillStyle = '#92400e';
      ctx.fillText('这是由 Python 代码转成的网页动画', 180, 560);
    }

    function animate(now) {
      if (!state.lastTime) state.lastTime = now;
      const delta = now - state.lastTime;
      state.lastTime = now;
      state.blinkTimer += delta;

      if (state.blinkTimer > 1200) {
        state.blink = 1 - state.blink;
        state.blinkTimer = 0;
      }

      drawPikachu();
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
