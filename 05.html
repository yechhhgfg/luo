<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>粒子星云</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #111827 0%, #030712 100%);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      width: min(100vw, 800px);
      height: auto;
      display: block;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      background: radial-gradient(circle at top, #111827 0%, #030712 100%);
    }
  </style>
</head>
<body>
  <canvas id="scene" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const particles = Array.from({ length: 180 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.8 + 0.2,
      angle: Math.random() * Math.PI * 2,
      hue: Math.random() * 360,
    }));

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 400);
      g.addColorStop(0, '#111827');
      g.addColorStop(1, '#030712');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function animate(time) {
      drawBackground();
      particles.forEach((p, i) => {
        p.angle += 0.01 + i * 0.00005;
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue + time * 0.01}, 90%, 70%, 0.9)`;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
