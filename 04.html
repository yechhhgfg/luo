<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>烟花爆炸</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      width: min(100vw, 800px);
      height: auto;
      display: block;
      background: #020617;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <canvas id="scene" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    let particles = [];

    function randomColor() {
      const colors = ['#f59e0b', '#fb7185', '#38bdf8', '#a78bfa', '#34d399', '#fef3c7'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function spawnFirework() {
      const x = Math.random() * W;
      const y = Math.random() * H * 0.6 + 80;
      const burstCount = 40 + Math.floor(Math.random() * 20);
      for (let i = 0; i < burstCount; i += 1) {
        const angle = (Math.PI * 2 * i) / burstCount + Math.random() * 0.2;
        const speed = 1.5 + Math.random() * 2.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 60 + Math.random() * 40,
          color: randomColor(),
          size: 2 + Math.random() * 2,
        });
      }
    }

    function drawBackground() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.18)';
      ctx.fillRect(0, 0, W, H);
    }

    function animate() {
      drawBackground();
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.01;
        p.life -= 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      particles = particles.filter((p) => p.life > 0);
      if (Math.random() < 0.03) {
        spawnFirework();
      }
      requestAnimationFrame(animate);
    }

    setInterval(spawnFirework, 700);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
